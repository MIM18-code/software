<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Backlot mark: a studio lot. Sawtooth soundstage with the elephant door, water tower behind it, in the strip colors on navy.
       The tile sits at 80% with a drop shadow, the way macOS draws its own icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="1" stop-color="#18202e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A90EC"/>
      <stop offset="1" stop-color="#3D72D0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect x="6.4" y="7.4" width="51.2" height="51.2" rx="11.2" fill="#000" opacity="0.35" filter="url(#shadow)"/>
  <g transform="translate(6.4 6.4) scale(0.8)">
    <g clip-path="url(#tile)">
      <rect width="64" height="64" fill="url(#bg)"/>
      <rect width="64" height="64" fill="url(#glow)"/>
      <g transform="translate(-1 3)">
      <!-- water tower, behind the stage: cone roof, finial, tank with a band, platform, legs and two brace tiers -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <path d="M48.5 22 L46.2 48.6 M57.5 22 L59.8 48.6" fill="none" stroke="#4F86E8" stroke-width="1.9"/>
        <path d="M47.8 30 H58.2 M47.1 38.5 H58.9 M47.8 30 L58.9 38.5 M58.2 30 L47.1 38.5" fill="none" stroke="#4F86E8" stroke-width="1.3"/>
        <path d="M46.6 22 H59.4" fill="none" stroke="#3A6FCB" stroke-width="1.5"/>
        <rect x="47" y="12.2" width="12" height="9.4" rx="1.6" fill="url(#tank)"/>
        <rect x="47" y="17.6" width="12" height="1.1" fill="#2F5FB5" opacity="0.8"/>
        <path d="M46 12.6 L53 7.4 L60 12.6 Z" fill="#6FA0F0"/>
        <path d="M53 7.4 V5.2" fill="none" stroke="#6FA0F0" stroke-width="1.5"/>
      </g>
      <!-- ground and the stage's shadow on it -->
      <rect x="5" y="48" width="54" height="2.8" rx="1.4" fill="#3FA86A"/>
      <rect x="9" y="47.2" width="38" height="0.9" fill="#000" opacity="0.28"/>
      <!-- shaded side wall gives the block depth -->
      <path d="M44 48 V25.5 L48 28.6 V48 Z" fill="#C9D1DE"/>
      <!-- stage block, sawtooth roof -->
      <path d="M8 48 V32 L14 25.5 V32 L20 25.5 V32 L26 25.5 V32 L32 25.5 V32 L38 25.5 V32 L44 25.5 V48 Z" fill="#FFFFFF"/>
      <!-- north-light glazing on each slanted face -->
      <g fill="#A9CBF5">
        <path d="M8.9 31.3 L13.2 26.6 V31.3 Z"/>
        <path d="M14.9 31.3 L19.2 26.6 V31.3 Z"/>
        <path d="M20.9 31.3 L25.2 26.6 V31.3 Z"/>
        <path d="M26.9 31.3 L31.2 26.6 V31.3 Z"/>
        <path d="M32.9 31.3 L37.2 26.6 V31.3 Z"/>
        <path d="M38.9 31.3 L43.2 26.6 V31.3 Z"/>
      </g>
      <!-- elephant door, two leaves with the seam -->
      <rect x="14" y="34.5" width="16" height="13.5" fill="#1f2a3c"/>
      <rect x="21.5" y="34.5" width="1" height="13.5" fill="#FFFFFF"/>
      <rect x="14" y="34.5" width="16" height="0.9" fill="#3D4B63"/>
      <!-- stage number plate -->
      <rect x="33.6" y="35.6" width="7" height="5" rx="1" fill="#F2D34B"/>
      <path d="M35.5 36.9 H39 L36.9 39.6" fill="none" stroke="#1f2a3c" stroke-width="0.95" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
